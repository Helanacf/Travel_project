{% extends 'base.html' %}
{% block title %}Login - TravelSpot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header text-light text-center py-4" style="background-color: var(--dark); color:white">
                <h4 class="mb-0 text-light">Sign In</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-medium">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                </form>
                <div class="text-center mt-4">
                    <p>Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-medium">Register</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
